name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The BPF object loader (internal/bpf/lustreebpfexporter_*_bpfel.go) is
      # generated by bpf2go and gitignored, so CI must regenerate it before
      # any package that imports internal/bpf can build. Toolchain list
      # mirrors build/docker/go-exporter.Dockerfile so local Docker builds
      # and CI stay in sync.
      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      - name: Generate BPF bindings
        env:
          BPF_CFLAGS: "-I. -I/usr/include/x86_64-linux-gnu -D__TARGET_ARCH_x86"
        run: make generate-go-exporter GOOS=linux GOARCH=amd64

      - name: Run tests
        run: go test ./...

      # TestNewEventSource and TestNewEventSourceFailures load the embedded
      # BPF object for real, so they skip in the unprivileged run above. Run
      # them as root here (the runner kernel has BTF, and the tests fake the
      # kprobe attaches); LUSTRE_EBPF_REQUIRE_BPF=1 turns a skip into a
      # failure.
      - name: Run BPF loading tests as root
        run: |
          go test -c -o "$RUNNER_TEMP/goexporter.test" ./internal/goexporter
          cd internal/goexporter
          sudo LUSTRE_EBPF_REQUIRE_BPF=1 "$RUNNER_TEMP/goexporter.test" -test.run '^TestNewEventSource' -test.v
