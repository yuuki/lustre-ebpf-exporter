name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Weekly: the fuzz job runs longer, and toolchain or runner kernel drift
  # shows up without a pull request.
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # bpf2go needs clang and the BPF headers; the list mirrors
      # build/docker/go-exporter.Dockerfile so local Docker builds and CI stay
      # in sync.
      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      # The BPF object loader (internal/bpf/lustreebpfexporter_*_bpfel.go) is
      # generated by bpf2go and gitignored, so CI must regenerate it before
      # any package that imports internal/bpf can build.
      - name: Generate BPF bindings
        run: make generate-go-exporter GOOS=linux GOARCH=amd64

      - name: Run tests
        run: make test-race

      # The tests that load the embedded BPF object (TestNewEventSource*) or
      # create its maps skip in the unprivileged run above. Run the package's
      # tests again as root (the runner kernel has BTF, so the object must pass
      # its verifier; the tests fake the kprobe attaches, so no Lustre is
      # needed); LUSTRE_EBPF_REQUIRE_BPF=1 turns a skip into a failure.
      - name: Run BPF loading tests as root
        run: make test-integration

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      # golangci-lint type-checks internal/bpf, which needs the bindings.
      - name: Generate BPF bindings
        run: make generate-go-exporter GOOS=linux GOARCH=amd64

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # GOLANGCI_LINT_VERSION in the Makefile

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Short on pull requests and pushes, longer on the weekly run.
      FUZZTIME: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm libbpf-dev libelf-dev linux-libc-dev

      - name: Generate BPF bindings
        run: make generate-go-exporter GOOS=linux GOARCH=amd64

      - name: Fuzz
        run: make test-fuzz

      # A failing input is written to testdata/fuzz/<FuzzTarget>/ of its
      # package; keep it, to reproduce the failure and add it as a seed.
      - name: Upload failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint runs through `go run`.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: actionlint and zizmor
        run: make lint-actions
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online audits
