version: "2"

# The bpf2go bindings (internal/bpf/*_bpfel.go) must be generated before
# linting (`make generate-go-exporter`); they are generated code, so
# exclusions.generated (lax by default) keeps findings in them out.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes: [] # add rule IDs only with a one-line rationale each
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx]

formatters:
  enable:
    - gofmt
